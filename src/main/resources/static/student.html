<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sinh viên</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="/adminlte/css/adminlte.css">
    <style>
        .student-id-column { width: 15%; }
        .student-name-column { width: 20%; }
        .student-email-column { width: 25%; }
        .student-phone-column { width: 15%; }
        .student-class-column { width: 10%; }
        .student-actions-column { width: 15%; text-align: right; }
    </style>
</head>
<body class="bg-light p-4">
    <div class="container-fluid bg-white p-4 rounded shadow-sm">
        <h2 class="fw-bold mb-4">Danh sách sinh viên</h2>
        
        <table class="table align-middle">
            <thead>
                <tr class="fw-bold">
                    <th class="student-id-column">Mã sinh viên</th>
                    <th class="student-name-column">Họ và tên</th>
                    <th class="student-email-column">Email</th>
                    <th class="student-phone-column">Số điện thoại</th>
                    <th class="student-class-column">Lớp</th>
                    <th class="student-actions-column">Hành động</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <tr>
                    <td colspan="6" class="text-center">Đang tải dữ liệu...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal Xem / Sửa Sinh Viên -->
    <div class="modal fade" id="studentModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle">Thông tin sinh viên</h5>
                    <button type="button" class="btn-close" onclick="closeModal()" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="modalStudentForm">
                        <input type="hidden" id="modalStudentId">
                        <div class="mb-3">
                            <label class="form-label">Mã sinh viên</label>
                            <input type="text" class="form-control" id="modalStudentCode" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Họ và tên</label>
                            <input type="text" class="form-control" id="modalFullName" required>
                            </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="modalEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" class="form-control" id="modalPhone">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Lớp</label>
                            <input type="text" class="form-control" id="modalClassName">
                        </div>
                        <div class="text-end pt-2">
                            <button type="button" class="btn btn-secondary me-2" onclick="closeModal()">Đóng</button>
                            <button type="submit" class="btn btn-warning text-dark fw-semibold" id="btnSaveModal">Lưu thay đổi</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Thư viện Bootstrap JS bắt buộc phải có để chạy Modal Popup -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/student.js"></script>
</body>
</html>
